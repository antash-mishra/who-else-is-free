app = "who-else-is-free-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  APPLE_OAUTH_AUDIENCES = "com.whoelseisfree.app"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the server running instead of auto-stopping on idle.
  auto_stop_machines = "off"
  auto_start_machines = true
  # Ensure at least one machine is always running.
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "data"
  destination = "/data"
