name: Android Release

# Builds a production Android App Bundle on EAS and uploads it to Google Play
# through EAS Submit (Google Play Developer API). Run it from the Actions tab or
# with `gh workflow run android-release.yml -f track=internal`.
#
# Needs the EXPO_TOKEN repository secret. The Google Play service account key
# is stored on EAS (`eas credentials`), never in this repository. The very first
# upload of the app has to be done by hand in Play Console; see
# docs/play-store-release.md.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track (submit profile in eas.json); none only builds the bundle
        type: choice
        options:
          - internal
          - closed
          - production
          - none
        default: internal

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and submit to Google Play
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # EAS evaluates app.config.js locally, which loads the config plugins.
      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit
        env:
          # The local fingerprint step took over ten minutes on this repo and
          # only feeds build metadata.
          EAS_SKIP_AUTO_FINGERPRINT: '1'
        run: >-
          eas build
          --platform android
          --profile production
          ${{ inputs.track != 'none' && format('--auto-submit-with-profile {0}', inputs.track) || '' }}
          --non-interactive
          --message "${{ inputs.track }} from ${{ github.sha }}"
